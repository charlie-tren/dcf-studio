<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="7" fill="#131a24"/>
  <!-- Near-term flows stepping out, fading as the forecast gets less certain... -->
  <rect x="5" y="19" width="3.6" height="5" rx="1.2" fill="#82a8ca"/>
  <rect x="10.4" y="16" width="3.6" height="8" rx="1.2" fill="#82a8ca" opacity=".8"/>
  <rect x="15.8" y="13.5" width="3.6" height="10.5" rx="1.2" fill="#82a8ca" opacity=".6"/>
  <!-- ...into the terminal value, which is where most of the number actually lives. -->
  <rect x="21.6" y="8" width="5" height="16" rx="1.5" fill="#d9a441"/>
</svg>
