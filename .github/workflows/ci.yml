name: CI

# DCF Studio had 221 tests and no workflow at all. It deploys on push, so until
# now the valuation maths, the WACC and terminal-value code, the FX handling and
# the backsolve could all break and reach the live site with nothing objecting.
#
# Same shape as crowdwise's CI, which is the house pattern for the Next projects.
#
# Hosting is a Cloudflare Worker built by OpenNext (moved off Vercel 13/11/2026).
# A push to master deploys; every other run dry-runs the Worker bundle.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npx opennextjs-cloudflare build
      - if: github.ref != 'refs/heads/master'
        run: npx wrangler deploy --dry-run --outdir dist-dry
      - if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
